models:
- name: fct_ers_nhse_process
  description: One record for each ers referral. The referrals are created using NHSE logic
  config:
    meta:
      owner:
        name: Jagdeep Lamba
  columns:
  - name: sk_patient_id
    description: Shared pseudonymised NHS-number key. Null for blank values and the source unknown marker 
      1; no demographic or registration filter is applied.
  - name: ubrn_id
    description: Source identifier of the referral, triage or advice request.
  - name: ubrn
    description: Supplied booking reference, preserved unchanged.
  - name: action_at
    description: Recorded date and time of the action.    
  - name: action_sequence
    description: Sequence number of the action, starting at 1 for the first action and incrementing by 1 for each subsequent action.
  - name: action_code
    description: Code of the action, as supplied by the source system.